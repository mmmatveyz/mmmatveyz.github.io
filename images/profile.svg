<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
  </g>

  <!-- Hexagonal Tech Ring -->
  <circle cx="200" cy="180" r="105" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="8 6" />
  <circle cx="200" cy="180" r="95" fill="rgba(99,102,241,0.06)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5" />

  <!-- Stylized Avatar Icon (Head & Torso) -->
  <!-- Torso -->
  <path d="M 120 330 C 120 270, 160 250, 200 250 C 240 250, 280 270, 280 330 Z" fill="url(#accentGrad)" opacity="0.85" />
  
  <!-- Head -->
  <circle cx="200" cy="170" r="52" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="3" />
  
  <!-- Engineering Goggles / Tech Visor -->
  <rect x="165" y="155" width="70" height="20" rx="10" fill="#06b6d4" filter="url(#glow)" opacity="0.9" />
  <line x1="160" y1="165" x2="240" y2="165" stroke="#ffffff" stroke-width="2" opacity="0.8" />

  <!-- Lightning Badge in front -->
  <g transform="translate(185, 275) scale(1.3)">
    <polygon points="12 2 4 14 11 14 9 22 18 10 12 10" fill="#fbbf24" filter="url(#glow)" />
  </g>

  <!-- Name & Title Tech Tag -->
  <rect x="60" y="348" width="280" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
  <text x="200" y="370" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    ⚡ МАТВЕЙ ЗРЯЧИХ
  </text>
</svg>
