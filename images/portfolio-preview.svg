<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c121e" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.4)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.3)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Courier New", monospace; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="640" cy="320" r="150" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Background Constellation Mesh -->
  <g opacity="0.22" stroke="#818cf8" stroke-width="1">
    <line x1="80" y1="90" x2="210" y2="160" />
    <line x1="210" y1="160" x2="340" y2="110" />
    <line x1="340" y1="110" x2="480" y2="190" />
    <line x1="480" y1="190" x2="620" y2="130" />
    <line x1="620" y1="130" x2="730" y2="220" />
    <line x1="210" y1="160" x2="160" y2="280" />
    <line x1="160" y1="280" x2="310" y2="330" />
    <line x1="310" y1="330" x2="480" y2="190" />
    <line x1="480" y1="190" x2="570" y2="350" />
    <line x1="570" y1="350" x2="710" y2="370" />
    <line x1="620" y1="130" x2="570" y2="350" />
  </g>

  <!-- Mesh Nodes -->
  <g fill="#06b6d4">
    <circle cx="80" cy="90" r="3" />
    <circle cx="210" cy="160" r="3.5" fill="#818cf8" />
    <circle cx="340" cy="110" r="2.5" />
    <circle cx="480" cy="190" r="4" fill="#a5b4fc" />
    <circle cx="620" cy="130" r="3" />
    <circle cx="730" cy="220" r="3" />
    <circle cx="160" cy="280" r="2.5" />
    <circle cx="310" cy="330" r="3.5" fill="#818cf8" />
    <circle cx="570" cy="350" r="3" />
    <circle cx="710" cy="370" r="2.5" fill="#818cf8" />
  </g>

  <!-- Browser Frame -->
  <g transform="translate(45, 28)">
    <rect x="0" y="0" width="710" height="394" rx="14" fill="none" stroke="url(#windowBorder)" stroke-width="1.5" />
    <rect x="0.5" y="0.5" width="709" height="393" rx="13.5" fill="rgba(10, 14, 23, 0.92)" />

    <!-- Browser Header Bar -->
    <path d="M 0,14 C 0,6.268 6.268,0 14,0 L 696,0 C 703.732,0 710,6.268 710,14 L 710,44 L 0,44 Z" fill="rgba(15, 23, 42, 0.95)" />
    <line x1="0" y1="44" x2="710" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="24" cy="22" r="5.5" fill="#ef4444" opacity="0.85" />
    <circle cx="42" cy="22" r="5.5" fill="#f59e0b" opacity="0.85" />
    <circle cx="60" cy="22" r="5.5" fill="#10b981" opacity="0.85" />

    <!-- Address Bar -->
    <rect x="180" y="10" width="350" height="24" rx="6" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(255, 255, 255, 0.08)" />
    <g transform="translate(195, 16)" stroke="#10b981" stroke-width="1.3" fill="none">
      <rect x="0" y="4" width="8" height="6" rx="1" />
      <path d="M 2,4 L 2,2 C 2,0.9 2.9,0 4,0 C 5.1,0 6,0.9 6,2 L 6,4" />
    </g>
    <text x="212" y="26" fill="#94a3b8" font-size="11" class="font-mono">https://mmmatveyz.github.io</text>

    <!-- Inner Web Content Preview -->
    <g transform="translate(32, 62)">
      <!-- Navbar Mockup -->
      <text x="0" y="20" fill="#f8fafc" font-size="16" font-weight="700" class="font-sans">mm<tspan fill="#818cf8">matveyz</tspan></text>
      
      <g transform="translate(410, 8)" class="font-sans" font-size="11" fill="#94a3b8">
        <text x="0" y="10" fill="#818cf8" font-weight="600">Главная</text>
        <text x="60" y="10">Проекты</text>
        <text x="125" y="10">Контакты</text>
        <text x="190" y="10">Резюме 📄</text>
      </g>

      <!-- Status Pill -->
      <g transform="translate(0, 38)">
        <rect width="326" height="22" rx="11" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.25)" />
        <circle cx="12" cy="11" r="3.5" fill="#10b981" filter="url(#subtleGlow)" />
        <text x="24" y="15" fill="#34d399" font-size="10.5" font-weight="500" class="font-sans">Открыт к предложениям • Электромонтёр 6 разряда</text>
      </g>

      <!-- Hero Headline -->
      <text x="0" y="90" fill="#f8fafc" font-size="22" font-weight="800" class="font-sans">Матвей Зрячих</text>
      <text x="0" y="116" fill="url(#accentGlow)" font-size="17" font-weight="700" class="font-sans">Электромонтёр-инженер &amp; Python Developer</text>
      <text x="0" y="138" fill="#94a3b8" font-size="11.5" class="font-sans">Обслуживание ЧПУ (Siemens, Fanuc), силовая электроника &amp; автоматизация</text>

      <!-- Metric Cards Grid -->
      <g transform="translate(0, 162)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="138" height="66" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" />
        <text x="14" y="27" fill="#818cf8" font-size="17" font-weight="700" class="font-sans">4.5 года</text>
        <text x="14" y="44" fill="#94a3b8" font-size="9.5" class="font-sans">Опыт на заводах</text>
        <text x="14" y="56" fill="#64748b" font-size="8.5" class="font-sans">«Силовые машины»</text>

        <!-- Card 2 -->
        <rect x="150" y="0" width="138" height="66" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" />
        <text x="164" y="27" fill="#06b6d4" font-size="17" font-weight="700" class="font-sans">6 разряд</text>
        <text x="164" y="44" fill="#94a3b8" font-size="9.5" class="font-sans">Электромонтёр ЧПУ</text>
        <text x="164" y="56" fill="#64748b" font-size="8.5" class="font-sans">Высшая квалификация</text>

        <!-- Card 3 -->
        <rect x="300" y="0" width="138" height="66" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" />
        <text x="314" y="27" fill="#a855f7" font-size="17" font-weight="700" class="font-sans">Aiogram 3</text>
        <text x="314" y="44" fill="#94a3b8" font-size="9.5" class="font-sans">Telegram-боты</text>
        <text x="314" y="56" fill="#64748b" font-size="8.5" class="font-sans">Автоматизация табелей</text>

        <!-- Code Snippet / Tech Tag Card -->
        <g transform="translate(450, 0)">
          <rect x="0" y="0" width="195" height="66" rx="8" fill="rgba(7, 10, 18, 0.85)" stroke="rgba(99, 102, 241, 0.25)" />
          <text x="12" y="19" fill="#64748b" font-size="9" class="font-mono">// Serverless Architecture</text>
          <text x="12" y="34" fill="#38bdf8" font-size="9.5" class="font-mono">const backend = "GAS API";</text>
          <text x="12" y="50" fill="#34d399" font-size="9.5" class="font-mono">theme: "Dark / Glassmorphism";</text>
        </g>
      </g>

      <!-- Bottom Tech Badges -->
      <g transform="translate(0, 246)" class="font-sans" font-size="10" font-weight="500">
        <rect x="0" y="0" width="82" height="22" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" />
        <text x="10" y="15" fill="#a5b4fc">⚡ JavaScript</text>

        <rect x="92" y="0" width="100" height="22" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" />
        <text x="102" y="15" fill="#67e8f9">🌌 Canvas Mesh</text>

        <rect x="202" y="0" width="132" height="22" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.3)" />
        <text x="212" y="15" fill="#d8b4fe">🔒 Google Apps Script</text>

        <rect x="344" y="0" width="112" height="22" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" />
        <text x="354" y="15" fill="#6ee7b7">💎 Glassmorphism</text>
      </g>
    </g>
  </g>
</svg>
