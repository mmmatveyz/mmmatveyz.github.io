<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <!-- Industrial Technical Schematic: Engineering Portfolio -->
  <rect width="800" height="450" fill="#0d1117" />
  
  <!-- Subtle technical grid -->
  <defs>
    <pattern id="techGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f293d" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#techGrid)" />

  <style>
    .mono { font-family: 'JetBrains Mono', monospace, Consolas; font-size: 11px; fill: #94a3b8; }
    .mono-bold { font-family: 'JetBrains Mono', monospace, Consolas; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f1f5f9; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
  </style>

  <!-- Frame Header -->
  <rect x="40" y="30" width="720" height="390" rx="8" fill="#131722" stroke="#262f40" stroke-width="1" />
  <rect x="40" y="30" width="720" height="34" rx="8" fill="#181d2a" />
  <line x1="40" y1="64" x2="760" y2="64" stroke="#262f40" stroke-width="1" />
  <circle cx="62" cy="47" r="4" fill="#ef4444" />
  <circle cx="76" cy="47" r="4" fill="#f59e0b" />
  <circle cx="90" cy="47" r="4" fill="#10b981" />
  <text x="110" y="51" class="mono">mmmatveyz.github.io :: SYSTEM_DIAGRAM [PORTFOLIO 2.0]</text>
  <text x="680" y="51" class="mono" fill="#10b981">ONLINE [200]</text>

  <!-- Node 1: Client Front (Static GitHub Pages) -->
  <g transform="translate(70, 100)">
    <rect width="190" height="130" rx="6" fill="#181e2b" stroke="#334155" stroke-width="1" />
    <text x="14" y="28" class="title">Client Tier</text>
    <text x="14" y="44" class="label">GitHub Pages CDN</text>
    <line x1="14" y1="56" x2="176" y2="56" stroke="#262f40" stroke-width="1" />
    <text x="14" y="74" class="mono">• Semantic HTML5</text>
    <text x="14" y="92" class="mono">• Slate System CSS</text>
    <text x="14" y="110" class="mono">• Vanilla ES6+ JS</text>
  </g>

  <!-- Bus line 1 -->
  <path d="M 260 165 L 340 165" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" />
  <polygon points="340,165 333,161 333,169" fill="#3b82f6" />
  <text x="270" y="155" class="mono" fill="#3b82f6">POST</text>

  <!-- Node 2: Serverless Processing (Google Apps Script) -->
  <g transform="translate(340, 100)">
    <rect width="200" height="130" rx="6" fill="#181e2b" stroke="#3b82f6" stroke-width="1" />
    <text x="14" y="28" class="title">Backend Tier</text>
    <text x="14" y="44" class="label">Google Apps Script Exec</text>
    <line x1="14" y1="56" x2="186" y2="56" stroke="#262f40" stroke-width="1" />
    <text x="14" y="74" class="mono">• Honeypot Trap</text>
    <text x="14" y="92" class="mono">• Time-Gate Validate</text>
    <text x="14" y="110" class="mono">• Auto-Publish / Review</text>
  </g>

  <!-- Bus line 2 -->
  <path d="M 540 165 L 610 165" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" />
  <polygon points="610,165 603,161 603,169" fill="#10b981" />
  <text x="555" y="155" class="mono" fill="#10b981">SYNC</text>

  <!-- Node 3: Storage Tier (Spreadsheet & Metrika) -->
  <g transform="translate(610, 100)">
    <rect width="120" height="130" rx="6" fill="#181e2b" stroke="#334155" stroke-width="1" />
    <text x="12" y="28" class="title">Storage</text>
    <text x="12" y="44" class="label">Persistent</text>
    <line x1="12" y1="56" x2="108" y2="56" stroke="#262f40" stroke-width="1" />
    <text x="12" y="74" class="mono">• DB Table</text>
    <text x="12" y="92" class="mono">• Telegram</text>
    <text x="12" y="110" class="mono">• Metrika</text>
  </g>

  <!-- Telemetry Row at Bottom -->
  <g transform="translate(70, 260)">
    <rect width="660" height="130" rx="6" fill="#141824" stroke="#262f40" stroke-width="1" />
    <text x="16" y="26" class="mono-bold">TELEMETRY & HARDWARE INTEGRATION SPECS</text>
    <line x1="16" y1="36" x2="644" y2="36" stroke="#1f2636" stroke-width="1" />

    <text x="16" y="58" class="mono">CNC CONTROLLER:</text>
    <text x="140" y="58" class="mono" fill="#e2e8f0">Siemens Sinumerik 840D sl / Fanuc Series 0i</text>

    <text x="16" y="80" class="mono">DRIVE BUS:</text>
    <text x="140" y="80" class="mono" fill="#e2e8f0">Sinamics S120, Simodrive 611 (Profibus-DP, Profinet)</text>

    <text x="16" y="102" class="mono">SOFTWARE STACK:</text>
    <text x="140" y="102" class="mono" fill="#e2e8f0">Python 3.11 (Aiogram 3, sentence-transformers, openpyxl, SQLite)</text>
  </g>
</svg>
